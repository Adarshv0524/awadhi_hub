name: Test

on:
  pull_request:
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/**
  push:
    branches:
      - main
    paths:
      - backend/**
      - frontend/**
      - .github/workflows/**

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_ENV: test
      JWT_SECRET_KEY: ci-test-secret
      FRONTEND_BASE_URL: http://localhost:4321
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: awadhi_ci

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: awadhi_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Schema Contract Check
        run: python backend/scripts/schema_contract_check.py

      - name: Strict Admin Contract Tests
        run: pytest backend/tests/test_admin_openapi_contract.py backend/tests/test_admin_payload_contract.py -q

      - name: Deprecated Admin Endpoint Usage Check
        run: python backend/scripts/check_admin_deprecated_usage.py

      - name: Generate API Reference From OpenAPI
        run: python backend/scripts/generate_api_reference.py

      - name: Verify API Reference Is Up To Date
        run: git diff --exit-code -- z_documentation/api/API_REFERENCE.md

      - name: Run backend tests
        run: pytest backend/tests -q

  frontend-admin-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Deprecated Analytics Paths
        run: |
          cd frontend
          npm run lint:deprecated-analytics

      - name: Install Playwright Browser
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Admin E2E Smoke Tests
        run: |
          cd frontend
          npm run test:e2e:admin
